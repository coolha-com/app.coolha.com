on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 默认 GITHUB_TOKEN 即可创建 tag + GitHub Release。
          # 若需让 release-please 创建的 PR 再触发其他 Actions（本仓库靠 Vercel Git 集成部署，无需），
          # 可改用 PAT：token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
